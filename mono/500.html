<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Something went wrong at Mono.">
  <title>500 — Something went wrong | Mono</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="error-page">
  <header class="site-header">
    <a class="wordmark" href="./" aria-label="Mono home">M<span>—</span></a>
    <nav aria-label="Error page navigation">
      <a href="./">Home</a>
      <a href="mailto:hello@mono.studio">Contact</a>
    </nav>
  </header>

  <main class="error-main">
    <section class="error-content" aria-labelledby="error-title">
      <p class="eyebrow reveal">500 / Internal server error</p>
      <div class="error-heading reveal reveal-delay-1">
        <p class="error-code" aria-hidden="true">500</p>
        <h1 id="error-title">A quiet<br><em>interruption.</em></h1>
      </div>
      <div class="error-footer reveal reveal-delay-2">
        <p>Something went wrong on our side. Take a moment, then try again or return to familiar ground.</p>
        <div class="error-actions">
          <a class="text-link" href="">Try again <span aria-hidden="true">↻</span></a>
          <a class="circle-link" href="./" aria-label="Return to the Mono home page"><span>←</span></a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
