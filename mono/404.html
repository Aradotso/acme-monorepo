<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The page you were looking for could not be found.">
  <title>Page not found — Mono</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="error-page">
  <header class="site-header">
    <a class="wordmark" href="./" aria-label="Mono home">M<span>—</span></a>
    <nav aria-label="Primary navigation">
      <a href="./#principles">Principles</a>
      <a href="./#contact">Contact</a>
    </nav>
  </header>

  <main class="error-main">
    <section class="error-content" aria-labelledby="error-title">
      <div class="error-heading">
        <p class="eyebrow reveal">Error / 404</p>
        <h1 id="error-title" class="reveal reveal-delay-1">Nothing<br><em>here.</em></h1>
      </div>
      <div class="error-bottom reveal reveal-delay-2">
        <p class="intro">The page may have moved, or the address might not be quite right.</p>
        <a class="error-link" href="./">Return home <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>

  <footer class="site-footer error-footer">
    <p class="eyebrow">Mono Studio</p>
    <p class="error-code" aria-hidden="true">404</p>
  </footer>
</body>
</html>
