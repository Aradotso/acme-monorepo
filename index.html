<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live macOS desktop pane demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="desktop-shell" aria-label="Live macOS desktop pane demo">
      <section class="menu-bar" aria-label="macOS menu bar">
        <div class="menu-group">
          <span class="apple" aria-hidden="true"></span>
          <strong>Finder</strong>
          <span>File</span>
          <span>Edit</span>
          <span>View</span>
          <span>Go</span>
          <span>Window</span>
        </div>
        <div class="menu-group menu-status">
          <span class="status-pill">Live</span>
          <span>Wi-Fi</span>
          <span>100%</span>
          <time id="clock" datetime="">Wed 8:44 PM</time>
        </div>
      </section>

      <section class="desktop-stage" aria-label="Desktop">
        <aside class="widget-stack" aria-label="Desktop widgets">
          <article class="widget weather">
            <span class="widget-kicker">Cupertino</span>
            <strong>68°</strong>
            <span>Clear evening</span>
          </article>
          <article class="widget calendar">
            <span class="widget-kicker">Today</span>
            <strong>15</strong>
            <span>Design review at 3:30</span>
          </article>
          <article class="widget activity">
            <span class="widget-kicker">Build</span>
            <strong id="build-percent">72%</strong>
            <span class="progress"><i id="build-bar"></i></span>
          </article>
        </aside>

        <section class="window" id="window" aria-label="Desktop pane window">
          <header class="window-titlebar" id="titlebar">
            <div class="traffic" aria-label="Window controls">
              <button class="close" type="button" aria-label="Close window"></button>
              <button class="minimize" type="button" aria-label="Minimize window"></button>
              <button class="zoom" type="button" aria-label="Zoom window"></button>
            </div>
            <div class="window-title">
              <span class="folder-icon"></span>
              Desktop Pane
            </div>
            <button class="toolbar-button" id="refresh" type="button">Sync</button>
          </header>

          <div class="window-body">
            <nav class="sidebar" aria-label="Finder sidebar">
              <button class="active" type="button" data-panel="overview">Recents</button>
              <button type="button" data-panel="projects">Projects</button>
              <button type="button" data-panel="terminal">Terminal</button>
              <button type="button" data-panel="settings">Settings</button>
            </nav>

            <section class="pane-content" aria-live="polite">
              <div class="pane-header">
                <div>
                  <span class="eyebrow">Live workspace</span>
                  <h1 id="pane-title">Desktop command center</h1>
                </div>
                <span class="pulse"><i></i> Connected</span>
              </div>

              <div class="metric-grid" id="metric-grid"></div>

              <section class="terminal-panel" aria-label="Live terminal output">
                <header>
                  <span>activity.log</span>
                  <span id="terminal-state">streaming</span>
                </header>
                <div class="terminal-lines" id="terminal-lines"></div>
              </section>
            </section>
          </div>
        </section>

        <nav class="dock" aria-label="macOS dock">
          <button type="button" data-app="finder" class="active" aria-label="Finder"><span>Finder</span></button>
          <button type="button" data-app="safari" aria-label="Safari"><span>Safari</span></button>
          <button type="button" data-app="music" aria-label="Music"><span>Music</span></button>
          <button type="button" data-app="messages" aria-label="Messages"><span>Messages</span></button>
          <button type="button" data-app="terminal" aria-label="Terminal"><span>Terminal</span></button>
          <button type="button" data-app="settings" aria-label="System Settings"><span>Settings</span></button>
        </nav>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
