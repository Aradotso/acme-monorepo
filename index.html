<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cosmic Beans coffee landing page.">
  <title>Cosmic Beans Coffee</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff7e8;
      --muted: #d8c1a3;
      --coffee: #2a1710;
      --espresso: #120b0a;
      --copper: #c97843;
      --mint: #8fd8c2;
      --cream: #ffe7b7;
      --line: rgba(255, 247, 232, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 24%, rgba(143, 216, 194, 0.22), transparent 26rem),
        radial-gradient(circle at 78% 18%, rgba(201, 120, 67, 0.28), transparent 24rem),
        linear-gradient(135deg, #160d16 0%, var(--espresso) 44%, #28140d 100%);
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem clamp(1rem, 4vw, 4rem);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      color: var(--ink);
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .brand-mark {
      width: 2.4rem;
      height: 2.4rem;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 247, 232, 0.08);
      color: var(--cream);
      font-size: 1.35rem;
    }

    nav {
      display: flex;
      gap: clamp(0.8rem, 2vw, 1.6rem);
      font-size: 0.92rem;
      color: var(--muted);
    }

    nav a {
      color: inherit;
      text-decoration: none;
    }

    main {
      display: grid;
      align-items: center;
      padding: clamp(2rem, 5vw, 5rem) clamp(1rem, 4vw, 4rem) 3rem;
    }

    .hero {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.7fr);
      gap: clamp(2rem, 6vw, 5rem);
      align-items: center;
    }

    .kicker {
      margin: 0 0 1rem;
      color: var(--mint);
      font-size: 0.86rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      max-width: 12ch;
      font-size: clamp(4rem, 10vw, 8.8rem);
      line-height: 0.86;
      letter-spacing: 0;
    }

    .tagline {
      max-width: 42rem;
      margin: 1.6rem 0 0;
      color: var(--muted);
      font-size: clamp(1.15rem, 2vw, 1.55rem);
      line-height: 1.5;
    }

    .planet {
      position: relative;
      min-height: 26rem;
      display: grid;
      place-items: center;
    }

    .planet::before {
      content: "";
      width: min(28rem, 78vw);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 28%, rgba(255, 231, 183, 0.95), transparent 0.35rem),
        radial-gradient(circle at 58% 38%, rgba(255, 247, 232, 0.8), transparent 0.22rem),
        radial-gradient(circle at 42% 62%, rgba(255, 247, 232, 0.66), transparent 0.28rem),
        linear-gradient(145deg, #6b351f, #2c1510 58%, #0e0808);
      box-shadow: 0 0 4rem rgba(201, 120, 67, 0.35), inset -1.2rem -1.6rem 2.5rem rgba(0, 0, 0, 0.45);
    }

    .ring {
      position: absolute;
      width: min(34rem, 86vw);
      height: 8rem;
      border: 0.7rem solid rgba(143, 216, 194, 0.45);
      border-left-color: rgba(255, 231, 183, 0.76);
      border-right-color: rgba(255, 231, 183, 0.76);
      border-radius: 50%;
      transform: rotate(-14deg);
    }

    .signup {
      margin-top: clamp(2rem, 5vw, 3rem);
      width: min(34rem, 100%);
      padding: 1rem;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 0.75rem;
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      background: rgba(18, 11, 10, 0.62);
      backdrop-filter: blur(20px);
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.22);
    }

    .field {
      min-width: 0;
      display: grid;
      gap: 0.45rem;
    }

    label {
      color: var(--cream);
      font-size: 0.78rem;
      font-weight: 800;
    }

    input {
      width: 100%;
      min-height: 2.8rem;
      padding: 0 0.85rem;
      border: 1px solid rgba(255, 247, 232, 0.2);
      border-radius: 0.4rem;
      background: rgba(255, 247, 232, 0.08);
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--mint);
      box-shadow: 0 0 0 3px rgba(143, 216, 194, 0.18);
    }

    button {
      align-self: end;
      min-height: 2.8rem;
      padding: 0 1.1rem;
      border: 0;
      border-radius: 0.4rem;
      background: var(--cream);
      color: #21110c;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      background: #fff1cf;
    }

    .note {
      margin-top: 1rem;
      color: rgba(255, 247, 232, 0.66);
      font-size: 0.92rem;
    }

    @media (max-width: 820px) {
      header {
        align-items: flex-start;
      }

      nav {
        display: none;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .planet {
        min-height: 18rem;
        grid-row: 1;
      }

      .signup {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="#top" aria-label="Cosmic Beans home">
        <span class="brand-mark" aria-hidden="true">✦</span>
        Cosmic Beans
      </a>
      <nav aria-label="Primary navigation">
        <a href="#signup">Crew list</a>
        <a href="#coffee">Roast path</a>
        <a href="#launch">Launch window</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div>
          <p class="kicker">Small-batch coffee for stargazers</p>
          <h1 id="hero-title">Cosmic Beans</h1>
          <p class="tagline">A bold orbit of cocoa, caramel, and nebula-bright citrus, roasted for mornings that need liftoff.</p>

          <form class="signup" id="signup" action="#" method="post">
            <div class="field">
              <label for="name">Your name</label>
              <input id="name" name="name" type="text" autocomplete="name">
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email">
            </div>
            <button type="submit">Join the crew</button>
          </form>
          <p class="note">First transmission includes tasting notes and the next roast drop.</p>
        </div>

        <div class="planet" id="coffee" aria-hidden="true">
          <span class="ring"></span>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
