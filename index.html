<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cosmic Beans</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090812;
        --ink: #fff7e8;
        --muted: #c8bfd9;
        --gold: #f6c45f;
        --rose: #e879a2;
        --blue: #64d4ff;
        --field: rgba(255, 247, 232, 0.1);
        --line: rgba(255, 247, 232, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 18%, rgba(100, 212, 255, 0.26), transparent 24rem),
          radial-gradient(circle at 82% 22%, rgba(232, 121, 162, 0.23), transparent 22rem),
          radial-gradient(circle at 55% 88%, rgba(246, 196, 95, 0.16), transparent 28rem),
          linear-gradient(135deg, #080711 0%, #151027 46%, #241328 100%);
      }

      main {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        padding: 32px;
      }

      main::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.82) 0 1px, transparent 1.5px),
          radial-gradient(circle, rgba(255, 255, 255, 0.38) 0 1px, transparent 1.5px);
        background-position:
          0 0,
          38px 57px;
        background-size:
          96px 96px,
          132px 132px;
        mask-image: linear-gradient(to bottom, black, transparent 88%);
        opacity: 0.32;
      }

      .hero {
        position: relative;
        width: min(1080px, 100%);
        padding: clamp(28px, 5vw, 72px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(9, 8, 18, 0.72);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
      }

      .brand {
        margin: 0 0 18px;
        color: var(--gold);
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(3rem, 9vw, 7.6rem);
        line-height: 0.92;
      }

      .tagline {
        max-width: 620px;
        margin: 26px 0 0;
        color: var(--muted);
        font-size: clamp(1.12rem, 2vw, 1.5rem);
        line-height: 1.55;
      }

      form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr)) auto;
        gap: 14px;
        align-items: end;
        max-width: 900px;
        margin-top: 42px;
      }

      label {
        display: grid;
        gap: 8px;
        color: rgba(255, 247, 232, 0.78);
        font-size: 0.88rem;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 54px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 16px;
        color: var(--ink);
        background: var(--field);
        font: inherit;
        outline: none;
      }

      input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(100, 212, 255, 0.16);
      }

      button {
        min-height: 54px;
        border: 0;
        border-radius: 8px;
        padding: 0 24px;
        color: #1a1023;
        background: linear-gradient(135deg, var(--gold), var(--rose));
        font: inherit;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 16px 32px rgba(232, 121, 162, 0.22);
      }

      button:hover {
        transform: translateY(-1px);
      }

      @media (max-width: 760px) {
        main {
          padding: 18px;
        }

        .hero {
          padding: 28px;
        }

        form {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="title">
        <p class="brand">Cosmic Beans</p>
        <h1 id="title">Coffee brewed beyond orbit.</h1>
        <p class="tagline">
          Small-batch roasts for early launches, late missions, and every
          strange little hour between the stars.
        </p>

        <form action="#" method="post">
          <label for="name">
            Your name
            <input id="name" name="name" type="text" autocomplete="name">
          </label>

          <label for="email">
            Email
            <input id="email" name="email" type="text" autocomplete="email">
          </label>

          <button type="submit">Join the crew</button>
        </form>
      </section>
    </main>
  </body>
</html>
